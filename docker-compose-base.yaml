name: costrict-metrics-demo

services:
  simulator:
    image: python:3.12-slim
    cpus: "1"
    mem_limit: 512m
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["python", "-u", "/app/metrics_simulator.py", "--port", "8888", "--data-dir", "/data"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8888:8888"
    volumes:
      - ./compose/simulator:/app:ro
      - ./data/simulator:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: quay.io/prometheus/prometheus:v3.5.1
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    depends_on:
      simulator:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-metrics-demo-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_DATA: /var/lib/grafana
      GF_PATHS_LOGS: /var/lib/grafana/log
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/metrics-sdk-demo.json
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./compose/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
